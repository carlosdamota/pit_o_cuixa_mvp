# openspec/config.yaml
schema: spec-driven

context: |
  Project: Pit o cuixa
  Stack: PHP 8.2+ (strict_types=1) + HTML5 + CSS (Design Tokens, BEM) + JavaScript (ES Modules) + SQLite (WAL)
  Team: 8 personas, 2 subequipos (frontend / backend), monorepo GitHub con Actions protegiendo main
  Language: Bilingüe ES/EN (i18n: es, en, ca)
  Hosting: Dinahosting (Apache + PHP 8.2 + SQLite)
  Design System: Primary #f7e721, Secondary #d32f2f, Surface #f7f9ff, Container #edf4ff/#ffffff,
    On Surface #1a1c1e, Quicksand font, 8px border radius
  Dependencies: None (sin Composer, sin frameworks, sin Node)
  CI: GitHub Actions (php -l, debug statement check, JSON validation, CSS brace matching)
  Architecture: Clean Architecture, Front Controller (public/index.php), Repository Pattern (PDO), SSR with PHP templates
  Features: PWA (Service Worker), SEO (JSON-LD, hreflang, sitemap), Admin Panel (token-based auth), CSV import/export

testing:
  strict_tdd: false
  reason: "Vanilla PHP test script, not a TDD runner. scripts/test-sync.php runs a real dependency-free integration suite (SQLite sync contract, throwaway temp DB); 38 tests passing, 0 failed as of 2026-08-05."
  runner: "php scripts/test-sync.php"
  layers:
    unit: { available: false, tool: "—" }
    integration: { available: true, tool: "scripts/test-sync.php (vanilla PHP + SQLite)" }
    e2e: { available: false, tool: "—" }
  coverage: { available: false, command: "—" }
  quality:
    linter: { available: true, command: "php -l" }
    type_checker: { available: false, command: "—" }
    formatter: { available: false, command: "—" }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Write proposals in English by default; switch to ES if user explicitly requests
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Specs in English by default; team may write scenarios bilingües ES/EN
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Leverage vanilla patterns (no frameworks, no Composer)
  tasks:
    - Group by subequipo (frontend / backend)
    - Use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Maintain vanilla PHP+JS+CSS stack discipline
    tdd: false
    test_command: "php scripts/test-sync.php"
  verify:
    test_command: "php scripts/test-sync.php"
    build_command: "php -l"  # Syntax check as minimal validation
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
