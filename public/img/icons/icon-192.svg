<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <!-- Minimalist hen: solid silhouette taken from the favicon chicken (amber on black) -->
  <rect width="512" height="512" rx="104" fill="#000000"/>

  <g transform="translate(-24 -25)">
    <!-- Comb -->
    <circle cx="147" cy="117" r="16" fill="#FCAD12"/>
    <circle cx="176" cy="110" r="18" fill="#FCAD12"/>
    <!-- Head -->
    <circle cx="163" cy="163" r="46" fill="#FCAD12"/>
    <!-- Beak -->
    <path d="M 120 150 L 86 166 L 120 180 Z" fill="#FCAD12"/>
    <!-- Neck -->
    <line x1="172" y1="178" x2="235" y2="270" stroke="#FCAD12" stroke-width="78" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="293" cy="308" rx="118" ry="100" fill="#FCAD12"/>
    <!-- Tail feathers -->
    <line x1="388" y1="262" x2="452" y2="170" stroke="#FCAD12" stroke-width="30" stroke-linecap="round"/>
    <line x1="394" y1="286" x2="462" y2="230" stroke="#FCAD12" stroke-width="30" stroke-linecap="round"/>
    <line x1="392" y1="306" x2="450" y2="292" stroke="#FCAD12" stroke-width="28" stroke-linecap="round"/>
    <!-- Legs and feet -->
    <path d="M 262 402 L 262 450 M 262 450 L 238 464 M 262 450 L 284 464" fill="none" stroke="#FCAD12" stroke-width="15" stroke-linecap="round"/>
    <path d="M 318 402 L 318 450 M 318 450 L 296 464 M 318 450 L 340 464" fill="none" stroke="#FCAD12" stroke-width="15" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="150" cy="155" r="9" fill="#000000"/>
    <!-- Wing (background-colored cutout) -->
    <path d="M 245 286 C 264 328 318 340 352 308" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
