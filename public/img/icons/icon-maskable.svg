<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffef6a"/>
      <stop offset="1" stop-color="#f5cb12"/>
    </linearGradient>
    <linearGradient id="meat" gradientUnits="userSpaceOnUse" x1="250" y1="130" x2="250" y2="370">
      <stop offset="0" stop-color="#f4a935"/>
      <stop offset="1" stop-color="#cf7410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Maskable: full-bleed background, artwork centered in 80% safe zone -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(56.32 56.32) scale(0.78)">
    <!-- Flames -->
    <path d="M 178 442 C 162 418 166 394 180 374 C 194 394 198 418 178 442 Z" fill="#d32f2f"/>
    <path d="M 334 442 C 318 418 322 394 336 374 C 350 394 354 418 334 442 Z" fill="#d32f2f"/>
    <path d="M 252 446 C 230 414 236 378 258 346 C 280 378 286 414 252 446 Z" fill="#e4572e"/>
    <path d="M 258 424 C 248 406 250 390 260 372 C 270 390 272 406 258 424 Z" fill="#ff9e2c"/>

    <!-- Spit rod -->
    <g fill="#1a1c1e">
      <circle cx="88" cy="250" r="18"/>
      <rect x="88" y="240" width="342" height="20" rx="10"/>
      <path d="M 426 247 L 460 250 L 426 257 Z"/>
    </g>
    <circle cx="88" cy="250" r="8" fill="#f5cb12"/>

    <!-- Roast bird -->
    <g fill="url(#meat)">
      <ellipse cx="250" cy="250" rx="100" ry="78"/>
      <ellipse cx="296" cy="212" rx="56" ry="50"/>
      <ellipse cx="266" cy="314" rx="52" ry="26"/>
      <path d="M 288 220 C 320 206 352 184 372 156 L 396 172 C 374 204 342 232 308 250 Z"/>
      <path d="M 308 262 C 344 250 380 230 406 204 L 424 224 C 396 254 356 278 316 292 Z"/>
    </g>

    <!-- Leg bones -->
    <g stroke-linecap="round" fill="#fff3d6">
      <line x1="384" y1="162" x2="408" y2="140" stroke="#1a1c1e" stroke-width="17"/>
      <line x1="384" y1="162" x2="408" y2="140" stroke="#fff3d6" stroke-width="11"/>
      <circle cx="414" cy="134" r="13" stroke="#1a1c1e" stroke-width="3"/>
      <circle cx="403" cy="123" r="11" stroke="#1a1c1e" stroke-width="3"/>
      <line x1="414" y1="214" x2="438" y2="194" stroke="#1a1c1e" stroke-width="17"/>
      <line x1="414" y1="214" x2="438" y2="194" stroke="#fff3d6" stroke-width="11"/>
      <circle cx="444" cy="188" r="13" stroke="#1a1c1e" stroke-width="3"/>
      <circle cx="433" cy="178" r="11" stroke="#1a1c1e" stroke-width="3"/>
    </g>

    <!-- Folded wing -->
    <path d="M 196 246 C 220 230 252 230 272 246 C 252 268 216 272 196 246 Z" fill="#b96408" opacity="0.55"/>

    <!-- Crispy highlight -->
    <ellipse cx="204" cy="216" rx="42" ry="28" fill="#ffdf8e" opacity="0.5" transform="rotate(-18 204 216)"/>
  </g>
</svg>
